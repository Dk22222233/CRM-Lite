<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Energy/Eco Icon for CRM Lite -->
  <defs>
    <linearGradient id="energyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00cc66;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Lightning bolt (energy symbol) -->
  <path d="M50 5 L50 45 L70 45 L45 75 L45 40 L25 40 Z" fill="url(#energyGrad)" stroke="#004d99" stroke-width="2"/>
  
  <!-- Leaf (eco symbol) -->
  <path d="M50 50 Q70 30 85 45 Q75 65 50 50" fill="#00cc66" stroke="#006633" stroke-width="1.5"/>
  <path d="M50 50 Q60 60 50 75" fill="none" stroke="#006633" stroke-width="1.5"/>
  
  <!-- Circle background -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="#0066cc" stroke-width="2" opacity="0.3"/>
</svg>
